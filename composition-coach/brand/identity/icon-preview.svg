<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="18 18 72 72">
  <title>JustRight app icon, 512 px preview</title>
  <!--
    Foreground over background, exactly as ic_launcher_foreground.xml / ic_launcher_background.xml
    draw them. Shows the adaptive icon's visible 72 dp viewport (18..90 of the 108 dp canvas) at
    512 px, full square with no rounding: the shape Google Play wants for the 512x512 store icon
    (Play applies its own mask). Export to 32-bit PNG for the Play Console.
    Ink #252A31 ground; Paper #F7F3EC ring (r 22, stroke 6) and pupil (r 12); Apricot #E9A17E
    catchlight (r 4 at 58,50, upper right of the pupil).
  -->
  <rect x="0" y="0" width="108" height="108" fill="#252A31"/>
  <circle cx="54" cy="54" r="22" fill="none" stroke="#F7F3EC" stroke-width="6"/>
  <circle cx="54" cy="54" r="12" fill="#F7F3EC"/>
  <circle cx="58" cy="50" r="4" fill="#E9A17E"/>
</svg>
