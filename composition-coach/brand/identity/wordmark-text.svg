<svg xmlns="http://www.w3.org/2000/svg" width="400" height="140" viewBox="0 0 400 140">
  <title>SceneRight wordmark, text only</title>
  <!--
    Text-only wordmark for places where the icon already sits next to it (store listing header,
    About screen) or where the mark would be too small. Transparent ground; Ink #252A31 text for
    Paper and other light grounds. On Ink or other dark grounds swap the fill to Paper #F7F3EC.
    "sceneRight" (lowercase s, capital R), Semibold; "photo" descriptor, Medium, spaced, right-aligned
    under the end of the name. The name is held to 340 px with textLength so the descriptor stays
    aligned whatever font renders. Font: Inter, else Roboto, else the platform sans. Outline the
    text before print.
  -->
  <text x="30" y="76" textLength="340" lengthAdjust="spacing"
        font-family="Inter, Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="72" font-weight="600" fill="#252A31">sceneRight</text>
  <text x="370" y="114" text-anchor="end"
        font-family="Inter, Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="17" font-weight="500" letter-spacing="6" fill="#252A31">phot<tspan letter-spacing="0">o</tspan></text>
</svg>
