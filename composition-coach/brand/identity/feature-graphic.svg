<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <title>Eyebright feature graphic, 1024 x 500</title>
  <!--
    Google Play feature graphic source. Play wants a 1024x500 PNG or JPEG with no alpha: outline the
    text, then export at 1x (and keep this SVG as the master). Key content stays inside the central
    safe area (no text within 64 px of the left edge or under the phone's lower third).
    Palette: Background #000000, Surface #121212, OnSurface #F2F2F2, muted white 70 %,
    Ready #34D399, Warn #FFC857. The only other colours are inside the "photo", which is a photo.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3440"/>
      <stop offset="0.75" stop-color="#8C7766"/>
      <stop offset="1" stop-color="#B89574"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="654" y="54" width="272" height="480" rx="30"/>
    </clipPath>
  </defs>

  <rect width="1024" height="500" fill="#000000"/>

  <!-- Lockup -->
  <g transform="translate(64,62)">
    <circle cx="26" cy="26" r="22" fill="none" stroke="#34D399" stroke-width="6"/>
    <circle cx="18" cy="18" r="5" fill="#FFFFFF"/>
  </g>
  <text x="134" y="102" font-family="Inter, Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="44" font-weight="600" letter-spacing="-0.8" fill="#F2F2F2">eyebright</text>

  <!-- Tagline and support line -->
  <text font-family="Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600"
        font-size="58" letter-spacing="-1.2" fill="#F2F2F2">
    <tspan x="64" y="236">The photo you</tspan>
    <tspan x="64" y="306">meant to take.</tspan>
  </text>
  <text font-family="Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24"
        fill="#FFFFFF" fill-opacity="0.7">
    <tspan x="64" y="372">Frames for you. Shows you why.</tspan>
    <tspan x="64" y="406">Everything stays on your phone.</tspan>
  </text>

  <!-- Phone -->
  <rect x="642" y="42" width="296" height="520" rx="42" fill="#121212" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>
  <g clip-path="url(#screen)">
    <rect x="654" y="54" width="272" height="480" fill="#000000"/>

    <!-- The photo: a person at dusk, framed left, level horizon -->
    <rect x="654" y="78" width="272" height="204" fill="url(#sky)"/>
    <rect x="654" y="232" width="272" height="50" fill="#1E2422"/>
    <circle cx="738" cy="176" r="17" fill="#141816"/>
    <path d="M704,282 C704,226 718,204 738,204 C758,204 772,226 772,282 Z" fill="#141816"/>

    <!-- After-the-shot card -->
    <rect x="654" y="282" width="272" height="252" fill="#121212"/>
    <circle cx="694" cy="322" r="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="5"/>
    <path d="M694,300 A22,22 0 1,1 677.0,308.0" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round"/>
    <text x="694" y="329" text-anchor="middle" font-family="Inter, Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="19" font-weight="700" fill="#F2F2F2">86</text>
    <text x="730" y="330" font-family="Inter, Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="24" font-weight="600" fill="#F2F2F2">Keeper</text>

    <text x="674" y="374" font-family="Inter, Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="12" font-weight="600" letter-spacing="0.6" fill="#FFFFFF" fill-opacity="0.7">WHAT WORKED</text>
    <circle cx="678" cy="393" r="4" fill="#34D399"/>
    <text x="690" y="398" font-family="Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#F2F2F2">Simple, clean background</text>
    <circle cx="678" cy="417" r="4" fill="#34D399"/>
    <text x="690" y="422" font-family="Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#F2F2F2">Level horizon</text>

    <text x="674" y="458" font-family="Inter, Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="12" font-weight="600" letter-spacing="0.6" fill="#FFFFFF" fill-opacity="0.7">TRY NEXT TIME</text>
    <circle cx="678" cy="477" r="4" fill="#FFC857"/>
    <text x="690" y="482" font-family="Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#F2F2F2">A step closer fills the frame</text>
  </g>
</svg>
