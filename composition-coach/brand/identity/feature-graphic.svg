<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <title>JustRight feature graphic, 1024 x 500</title>
  <!--
    Google Play feature graphic source. Play wants a 1024x500 PNG or JPEG with no alpha: outline the
    text, then export at 1x (and keep this SVG as the master). Text keeps 64 px from every edge.
    Left: the lockup, the header line, the tagline and the support line on Paper. Right: the dark card
    from the IDENTITY 01 board, the mark large and "One quiet cue. Everything settles."
    Palette (marketing): Paper #F7F3EC ground, Ink #252A31 text and card, Apricot #E9A17E only as the
    catchlight, Mist #E2E5E4 for the card's hairline. Secondary text is Ink at 72 % (about 5.5:1 on Paper).
    Font: Inter, else Roboto, else the platform sans.
  -->
  <rect width="1024" height="500" fill="#F7F3EC"/>

  <!-- Lockup: mark on paper (Ink ring and pupil, Apricot catchlight) + justRight + photo -->
  <g transform="translate(89,108)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#252A31" stroke-width="6"/>
    <circle cx="0" cy="0" r="12" fill="#252A31"/>
    <circle cx="4" cy="-4" r="4" fill="#E9A17E"/>
  </g>
  <text x="130" y="116" textLength="160" lengthAdjust="spacing"
        font-family="Inter, Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="38" font-weight="600" fill="#252A31">justRight</text>
  <text x="290" y="140" text-anchor="end"
        font-family="Inter, Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="12" font-weight="500" letter-spacing="4" fill="#252A31">phot<tspan letter-spacing="0">o</tspan></text>

  <!-- Header line -->
  <text x="64" y="212" font-family="Inter, Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="20" font-weight="500" fill="#252A31" fill-opacity="0.72">A little guidance. More keepers.</text>

  <!-- Tagline and support line -->
  <text font-family="Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600"
        font-size="56" letter-spacing="-1.4" fill="#252A31">
    <tspan x="62" y="282">The photo you</tspan>
    <tspan x="62" y="348">meant to take.</tspan>
  </text>
  <text x="64" y="408" font-family="Inter, Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="24" fill="#252A31" fill-opacity="0.72">Frames for you. Shows you why.</text>

  <!-- The dark card -->
  <rect x="600" y="56" width="360" height="388" rx="28" fill="#252A31"/>
  <rect x="600.5" y="56.5" width="359" height="387" rx="27.5" fill="none" stroke="#E2E5E4" stroke-opacity="0.12"/>
  <g transform="translate(780,206) scale(3)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#F7F3EC" stroke-width="6"/>
    <circle cx="0" cy="0" r="12" fill="#F7F3EC"/>
    <circle cx="4" cy="-4" r="4" fill="#E9A17E"/>
  </g>
  <text text-anchor="middle" font-family="Inter, Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="26" font-weight="500" fill="#F7F3EC">
    <tspan x="780" y="356">One quiet cue.</tspan>
    <tspan x="780" y="392">Everything settles.</tspan>
  </text>
</svg>
