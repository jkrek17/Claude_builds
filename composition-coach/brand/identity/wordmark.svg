<svg xmlns="http://www.w3.org/2000/svg" width="560" height="176" viewBox="0 0 560 176">
  <title>SceneRight wordmark</title>
  <!--
    Lockup, as on the IDENTITY 01 board: the mark at left, then the name "sceneRight" (lowercase s,
    capital R) in a clean sans, and the small spaced descriptor "photo" set under the right part of
    the name, its right edge aligned with the end of the name.
    Mark on Paper: Ink ring and pupil, Apricot catchlight at the upper right of the pupil. It is the
    launcher geometry (ring r 22 stroke 6, pupil r 12, catchlight r 4 at +4,-4) scaled x1.7273 so the
    ring's outer edge is 43 px.
    Font: Inter, else Roboto, else the platform sans; Semibold for the name, Medium for "photo". The
    name is held to 340 px with textLength so the descriptor stays aligned whatever font renders.
    Outline the text before print or PNG export so it does not depend on installed fonts.
    Clear space: half the mark's width on every side. Minimum size: 24 px tall mark.
    Colours: Paper #F7F3EC ground, Ink #252A31 text and mark, Apricot #E9A17E catchlight only.
  -->
  <rect width="560" height="176" fill="#F7F3EC"/>
  <g transform="translate(88,88) scale(1.7273)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#252A31" stroke-width="6"/>
    <circle cx="0" cy="0" r="12" fill="#252A31"/>
    <circle cx="4" cy="-4" r="4" fill="#E9A17E"/>
  </g>
  <text x="160" y="100" textLength="340" lengthAdjust="spacing"
        font-family="Inter, Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="72" font-weight="600" fill="#252A31">sceneRight</text>
  <text x="500" y="138" text-anchor="end"
        font-family="Inter, Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="17" font-weight="500" letter-spacing="6" fill="#252A31">phot<tspan letter-spacing="0">o</tspan></text>
</svg>
