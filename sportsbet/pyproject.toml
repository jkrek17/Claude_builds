[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sharpbet"
version = "0.1.0"
description = "Finds +EV bets against a de-vigged sharp line, ranks them and sizes the top 3 with fractional Kelly"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sharpbet = "sharpbet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sharpbet = ["sample_odds.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
