name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (composition engine, vision, app)
        run: ./gradlew :composition:test :vision:testDebugUnitTest :app:testDebugUnitTest --no-daemon

      - name: Lint (app), incl. verifyNoInternetPermission wired into check
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: composition-coach-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Publish the APK as a rolling pre-release so it can be downloaded from the repo's Releases page
      # (no login, no zip) instead of digging through the Actions run artifacts.
      - name: Publish rolling debug release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="debug-latest"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" CompositionCoach-debug.apk
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" CompositionCoach-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest debug build" \
            --notes "Debug APK built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Download CompositionCoach-debug.apk, open it on your phone, allow the install, and launch Composition Coach."

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            composition/build/reports/tests
            vision/build/reports/tests
            app/build/reports/tests
          if-no-files-found: ignore

  release:
    name: Build signed release APK/AAB
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Computed once, then used both to gate the "attach to release-latest" step (a plain `if` cannot
      # reference `secrets.*` directly in this repo's Actions setup for a compound boolean) and so the
      # log/job summary make it obvious which mode a given run built in.
      HAS_RELEASE_KEY: ${{ secrets.CC_RELEASE_KEYSTORE_BASE64 != '' && secrets.CC_RELEASE_KEYSTORE_PASSWORD != '' && secrets.CC_RELEASE_KEY_ALIAS != '' && secrets.CC_RELEASE_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Always builds — with a real upload key when the four secrets are set (see docs/RELEASE.md),
      # otherwise falling back to the checked-in debug keystore so this job (and local builds) never
      # break for lack of a Play signing key. Only the "attach to release-latest" step below is gated.
      - name: Assemble + bundle release
        env:
          CC_RELEASE_KEYSTORE_BASE64: ${{ secrets.CC_RELEASE_KEYSTORE_BASE64 }}
          CC_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.CC_RELEASE_KEYSTORE_PASSWORD }}
          CC_RELEASE_KEY_ALIAS: ${{ secrets.CC_RELEASE_KEY_ALIAS }}
          CC_RELEASE_KEY_PASSWORD: ${{ secrets.CC_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Verify release APK signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify app/build/outputs/apk/release/app-release.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: composition-coach-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: composition-coach-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # Same rolling-pre-release pattern as debug-latest, but only once there's a real signed build to
      # publish — with the debug-keystore fallback this APK isn't Play-uploadable, so it's not worth
      # publishing (or worse, mistaking for a real release) until real signing secrets are configured.
      - name: Publish rolling release build
        if: ${{ github.event_name == 'push' && env.HAS_RELEASE_KEY == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="release-latest"
          APK="app/build/outputs/apk/release/app-release.apk"
          cp "$APK" CompositionCoach-release.apk
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" CompositionCoach-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest release build" \
            --notes "Signed release APK (R8-shrunk) built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Download CompositionCoach-release.apk, open it on your phone, allow the install, and launch Composition Coach. See docs/RELEASE.md for how this is signed and how to cut a Play Store upload."
