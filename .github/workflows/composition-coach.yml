name: SceneRight (Android) CI

# Runs (and republishes the rolling APK releases) only when the Android app or this workflow changes.
on:
  push:
    branches: ["**"]
    paths: ["composition-coach/**", ".github/workflows/composition-coach.yml"]
  pull_request:
    paths: ["composition-coach/**", ".github/workflows/composition-coach.yml"]
  workflow_dispatch:

permissions:
  contents: write

# The rolling releases are recreated by every run, so runs must not overlap (a branch push and a
# fast-forward of main fire two runs for the same commit).
concurrency:
  group: composition-coach-releases
  cancel-in-progress: false

defaults:
  run:
    working-directory: composition-coach

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_MIRROR: ${{ secrets.CC_RELEASES_REPO != '' && secrets.CC_RELEASES_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (composition engine, vision, app)
        run: ./gradlew :composition:test :vision:testDebugUnitTest :app:testDebugUnitTest --no-daemon

      - name: Lint (app and vision) and the no-INTERNET-permission check
        run: ./gradlew :app:lintDebug :vision:lintDebug :app:verifyNoInternetPermission --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug -PabiSplits=true --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: composition-coach-debug-apk
          path: composition-coach/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Publish the APK as a rolling pre-release so it can be downloaded from the repo's Releases page
      # (no login, no zip) instead of digging through the Actions run artifacts.
      - name: Publish rolling debug release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="debug-latest"
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk SceneRight-debug.apk
          cp app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk SceneRight-debug-arm32.apk
          for i in 1 2 3; do
            gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>&1 | tee /tmp/del.log || true
            grep -q "release not found\|Not Found" /tmp/del.log && break
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || break
            sleep 5
          done
          gh release create "$TAG" SceneRight-debug.apk SceneRight-debug-arm32.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest debug build" \
            --notes "Debug APK built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Download SceneRight-debug.apk, open it on your phone, allow the install, and launch SceneRight. Composition Coach (and the short-lived Eyebright and JustRight builds) is now SceneRight: same app, install this over the old one and your settings stay."

      # Optional: mirror the debug APK to a separate public "releases" repository so testers can download
      # without a GitHub login while this repo stays private. Activates when both secrets exist:
      #   CC_RELEASES_REPO  = "owner/repo" of the public repository
      #   CC_RELEASES_TOKEN = a fine-grained PAT with Contents: read/write on that repository
      - name: Mirror APK to public releases repo
        if: ${{ github.event_name == 'push' && env.HAS_MIRROR == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.CC_RELEASES_TOKEN }}
          MIRROR_REPO: ${{ secrets.CC_RELEASES_REPO }}
        run: |
          set -eu
          TAG="latest"
          for i in 1 2 3; do
            gh release delete "$TAG" --yes --cleanup-tag --repo "$MIRROR_REPO" 2>&1 | tee /tmp/del.log || true
            grep -q "release not found\|Not Found" /tmp/del.log && break
            gh release view "$TAG" --repo "$MIRROR_REPO" >/dev/null 2>&1 || break
            sleep 5
          done
          gh release create "$TAG" SceneRight-debug.apk SceneRight-debug-arm32.apk \
            --repo "$MIRROR_REPO" \
            --title "SceneRight (test build)" \
            --notes "Test build ${GITHUB_SHA::7}. Most phones: download SceneRight-debug.apk, open it, allow the install. Composition Coach (and the short-lived Eyebright and JustRight builds) is now SceneRight: same app, install over the old one and your settings stay. See composition-coach/docs/TESTERS.md for install steps and what to report."

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            composition-coach/composition/build/reports/tests
            composition-coach/vision/build/reports/tests
            composition-coach/app/build/reports/tests
          if-no-files-found: ignore

  release:
    name: Build signed release APK/AAB
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Computed once, then used both to gate the "attach to release-latest" step (a plain `if` cannot
      # reference `secrets.*` directly in this repo's Actions setup for a compound boolean) and so the
      # log/job summary make it obvious which mode a given run built in.
      HAS_RELEASE_KEY: ${{ secrets.CC_RELEASE_KEYSTORE_BASE64 != '' && secrets.CC_RELEASE_KEYSTORE_PASSWORD != '' && secrets.CC_RELEASE_KEY_ALIAS != '' && secrets.CC_RELEASE_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Always builds — with a real upload key when the four secrets are set (see composition-coach/docs/RELEASE.md),
      # otherwise falling back to the checked-in debug keystore so this job (and local builds) never
      # break for lack of a Play signing key. Only the "attach to release-latest" step below is gated.
      - name: Assemble release APKs (per ABI)
        run: ./gradlew :app:assembleRelease -PabiSplits=true --no-daemon

      - name: Bundle release AAB
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Verify release APK signatures
        run: |
          for apk in app/build/outputs/apk/release/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          done

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: composition-coach-release-apk
          path: composition-coach/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: composition-coach-release-aab
          path: composition-coach/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # Same rolling-pre-release pattern as debug-latest. Published on every push so the R8-shrunk build
      # is always sideloadable; the notes say whether it carries the real upload key or the checked-in
      # debug key (same key as debug-latest, so it installs over those builds).
      - name: Publish rolling release build
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="release-latest"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk SceneRight-release-arm64.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk SceneRight-release-arm32.apk
          if [ "$HAS_RELEASE_KEY" = "true" ]; then KEYNOTE="Signed with the release upload key."; else KEYNOTE="Signed with the checked-in debug key (no release secrets configured yet): fine for testing, not Play-uploadable."; fi
          for i in 1 2 3; do
            gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>&1 | tee /tmp/del.log || true
            grep -q "release not found\|Not Found" /tmp/del.log && break
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || break
            sleep 5
          done
          gh release create "$TAG" SceneRight-release-arm64.apk SceneRight-release-arm32.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest release build" \
            --notes "R8-shrunk release build from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. ${KEYNOTE} Most phones: download SceneRight-release-arm64.apk, open it, allow the install. Composition Coach (and the short-lived Eyebright and JustRight builds) is now SceneRight: same app, install over the old one and your settings stay. See composition-coach/docs/RELEASE.md."
