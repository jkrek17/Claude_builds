name: sharpbet (sports betting harness) CI

on:
  push:
    branches: ["**"]
    paths: ["sportsbet/**", ".github/workflows/sportsbet.yml"]
  pull_request:
    paths: ["sportsbet/**", ".github/workflows/sportsbet.yml"]
  workflow_dispatch:
  schedule:
    # Every hour from 5 AM to 10 PM Eastern (UTC cron; 20 past, away from GitHub's busy top of the hour).
    # The slot job decides: rebuild 20 to 80 minutes before a kickoff slot, after inactives are out, and
    # once a day at the first run from 6 AM Eastern on. GitHub drops or delays many scheduled runs, so the
    # daily rebuild checks the live page's build time rather than relying on one cron firing on time.
    - cron: "20 10-23,0-3 * * *"

permissions:
  contents: read

jobs:
  slot:
    name: Is a kickoff slot coming up?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Scheduled runs rebuild only before a kickoff slot or for the daily 6 AM Eastern rebuild
          # (see slots.py); every other trigger always runs.
          if [ -n "$SCHEDULE" ]; then
            python3 sportsbet/src/nflmodel/slots.py >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test (Python ${{ matrix.python }})
    needs: slot
    if: needs.slot.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: sportsbet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  site:
    name: Build the predictions page
    needs: test
    runs-on: ubuntu-latest
    # Room for the NFL model plus the college step's own 8-minute cap.
    timeout-minutes: 35
    defaults:
      run:
        working-directory: sportsbet
    env:
      # Publish from main only: on a schedule, on a manual run, or when a change lands.
      PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sportsbet/site/package-lock.json
      - name: Build the page
        working-directory: sportsbet/site
        run: npm ci && npm run build
      - uses: actions/setup-python@v5
        if: env.PUBLISH == 'true'
        with:
          python-version: "3.13"
      - name: Restore the nflverse data cache
        if: env.PUBLISH == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/nflmodel
          key: nflmodel-data-${{ github.run_id }}
          restore-keys: nflmodel-data-
      - name: Run the model and write the page's data
        if: env.PUBLISH == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          pip install -e ".[model]"
          nflmodel --json site/dist/data/site.json
          # Player props for the Props tab. If this fails the picks still publish, and the tab says so.
          nflprops --json site/dist/data/props.json || echo "::warning::nflprops failed; the Props tab has no data"
          # Top plays on the Props tab: FanDuel prices for this week's games that have not kicked off
          # (about 2 Odds API credits a game). Without the ODDS_API_KEY secret the tab lists every prop.
          if [ -n "$ODDS_API_KEY" ] && [ -f site/dist/data/props.json ]; then
            python -m nflmodel.plays site/dist/data/props.json site/dist/data/plays.json \
              || echo "::warning::top plays failed; the Props tab opens on the full list"
          fi
      # College data: the play-by-play and fits (large, refreshed at most weekly) are one cache keyed by
      # ISO week, saved once a week; the saved pregame lines (espn/lines_<season>.json, small and not
      # rebuildable) are their own cache, saved every run. Both are saved even when the college step
      # fails or times out, so a slow run still warms the cache.
      - name: College cache keys
        id: cfbkey
        if: env.PUBLISH == 'true'
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore the college data cache
        id: cfbcache
        if: env.PUBLISH == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/cfbmodel
          key: cfbmodel-data-${{ steps.cfbkey.outputs.week }}
          restore-keys: cfbmodel-data-
      - name: Restore the saved college lines
        if: env.PUBLISH == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/cfbmodel/espn/lines_*.json
          key: cfbmodel-lines-${{ github.run_id }}
          restore-keys: cfbmodel-lines-
      # The college page. If this fails or times out the NFL page still publishes, and the college page
      # says so.
      - name: Run the college model and write its page's data
        if: env.PUBLISH == 'true'
        timeout-minutes: 8
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: cfbmodel site --json site/dist/data/cfb.json || echo "::warning::cfbmodel failed; the college page has no data"
      - name: Save the college lines
        if: always() && env.PUBLISH == 'true' && steps.cfbkey.outputs.week != ''
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/cfbmodel/espn/lines_*.json
          key: cfbmodel-lines-${{ github.run_id }}
      - name: Save the college data cache
        if: always() && env.PUBLISH == 'true' && steps.cfbkey.outputs.week != '' && steps.cfbcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/cfbmodel
          key: cfbmodel-data-${{ steps.cfbkey.outputs.week }}
      # The pages live at /nfl/ and /cfb/. The old address at the root sends visitors to /nfl/, keeping
      # the open tab. /cfb/ gets only what the college page loads: its page, script, stylesheet, fonts
      # and data/cfb.json (when the college step wrote one; without it the page says there is no data).
      - name: Put the page under /nfl with a redirect at the root
        if: env.PUBLISH == 'true'
        working-directory: sportsbet/site
        run: |
          rm -rf _pages
          mkdir -p _pages/cfb/data
          cp -r dist _pages/nfl
          rm -f _pages/nfl/cfb.html _pages/nfl/cfb.js _pages/nfl/data/cfb.json
          cp dist/cfb.html _pages/cfb/index.html
          cp dist/cfb.js dist/app.css _pages/cfb/
          cp -r dist/fonts _pages/cfb/fonts
          if [ -f dist/data/cfb.json ]; then cp dist/data/cfb.json _pages/cfb/data/; fi
          cp redirect.html _pages/index.html
          touch _pages/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: env.PUBLISH == 'true'
        with:
          path: sportsbet/site/_pages

  publish:
    name: Publish to GitHub Pages
    needs: site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
