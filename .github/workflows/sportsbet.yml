name: sharpbet (sports betting harness) CI

on:
  push:
    branches: ["**"]
    paths: ["sportsbet/**", ".github/workflows/sportsbet.yml"]
  pull_request:
    paths: ["sportsbet/**", ".github/workflows/sportsbet.yml"]
  workflow_dispatch:
  schedule:
    # Rebuild the predictions page every day at 6 AM US Eastern. Cron runs in UTC, so this fires at
    # 10:00 and 11:00 UTC and the slot job keeps only the one in the 6 AM Eastern hour (daylight or standard time).
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
    # Every hour from 8 AM to 10 PM Eastern: rebuild only when a kickoff slot starts in 20 to 80 minutes,
    # so each slot's starting quarterbacks are checked after inactives are out (see the slot job).
    - cron: "20 12-23,0-3 * * *"

permissions:
  contents: read

jobs:
  slot:
    name: Is a kickoff slot coming up?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # The hourly schedule runs only before a kickoff slot, and the daily pair only at 6 AM Eastern;
          # every other trigger always runs.
          if [ "$SCHEDULE" = "20 12-23,0-3 * * *" ]; then
            python3 sportsbet/src/nflmodel/slots.py >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "0 10 * * *" ] || [ "$SCHEDULE" = "0 11 * * *" ]; then
            if [ "$(TZ=America/New_York date +%H)" = "06" ]; then echo "run=true"; else echo "run=false"; fi >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test (Python ${{ matrix.python }})
    needs: slot
    if: needs.slot.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: sportsbet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  site:
    name: Build the predictions page
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sportsbet
    env:
      # Publish from main only: on a schedule, on a manual run, or when a change lands.
      PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sportsbet/site/package-lock.json
      - name: Build the page
        working-directory: sportsbet/site
        run: npm ci && npm run build
      - uses: actions/setup-python@v5
        if: env.PUBLISH == 'true'
        with:
          python-version: "3.13"
      - name: Restore the nflverse data cache
        if: env.PUBLISH == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/nflmodel
          key: nflmodel-data-${{ github.run_id }}
          restore-keys: nflmodel-data-
      - name: Run the model and write the page's data
        if: env.PUBLISH == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          pip install -e ".[model]"
          nflmodel --json site/dist/data/site.json
          # Player props for the Props tab. If this fails the picks still publish, and the tab says so.
          nflprops --json site/dist/data/props.json || echo "::warning::nflprops failed; the Props tab has no data"
          # Top plays on the Props tab: FanDuel prices for this week's games that have not kicked off
          # (about 2 Odds API credits a game). Without the ODDS_API_KEY secret the tab lists every prop.
          if [ -n "$ODDS_API_KEY" ] && [ -f site/dist/data/props.json ]; then
            python -m nflmodel.plays site/dist/data/props.json site/dist/data/plays.json \
              || echo "::warning::top plays failed; the Props tab opens on the full list"
          fi
      # The page lives at /nfl/. The old address at the root sends visitors there, keeping the open tab.
      - name: Put the page under /nfl with a redirect at the root
        if: env.PUBLISH == 'true'
        working-directory: sportsbet/site
        run: |
          mkdir -p _pages
          cp -r dist _pages/nfl
          cp redirect.html _pages/index.html
          touch _pages/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: env.PUBLISH == 'true'
        with:
          path: sportsbet/site/_pages

  publish:
    name: Publish to GitHub Pages
    needs: site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
