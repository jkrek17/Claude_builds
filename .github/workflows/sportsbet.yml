name: sharpbet (sports betting harness) CI

on:
  push:
    branches: ["**"]
    paths: ["sportsbet/**", ".github/workflows/sportsbet.yml"]
  pull_request:
    paths: ["sportsbet/**", ".github/workflows/sportsbet.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: sportsbet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
